services:
  whatsapp-gateway:
    build: .
    restart: unless-stopped
    environment:
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?Set a strong GATEWAY_TOKEN}
      ALLOWED_PHONE: ${ALLOWED_PHONE:?Set ALLOWED_PHONE}
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - whatsapp-data:/app/data
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    shm_size: 128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  whatsapp-data:
