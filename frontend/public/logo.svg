<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      /* <![CDATA[ */
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@700&display=swap');

      .text-color { fill: #2C2728; }
      
      /* Fonte do Di */
      .di-text {
        font-family: 'Playfair Display', serif;
        font-size: 140px;
        font-weight: 700;
        letter-spacing: -4px;
      }

      /* Fonte do Moda Íntima */
      .moda-text {
        font-family: 'Great Vibes', cursive;
        font-size: 80px;
        fill: #2C2728;
      }

      /* --- ANIMAÇÕES --- */

      #group-di-completo {
        opacity: 0;
        transform: translateY(-30px); 
        animation: fadeInPosition 1.5s ease-out forwards;
      }

      .folhinha-path {
        opacity: 0;
        animation: fadeIn 1s ease-out forwards;
        animation-delay: 0.8s;
      }

      #group-moda {
        clip-path: inset(0 100% 0 0);
        opacity: 0; 
        animation: revealWrite 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        animation-delay: 1s;
      }

      @keyframes fadeInPosition {
        to {
          opacity: 1;
          transform: translateY(0); 
        }
      }

      @keyframes revealWrite {
        to {
          opacity: 1;
          clip-path: inset(0 -20% 0 0);
        }
      }
      
      @keyframes fadeIn {
        to { opacity: 1; }
      }
      /* ]]> */
    </style>
  </defs>



  <g transform="translate(300, 150)">
    
    <g id="group-di-completo">
      
      <text x="45" y="10" text-anchor="end" class="text-color di-text">Di</text>
      
      <path class="text-color folhinha-path" 
            d="M 145,5 C 145,5 155,15 155,25 C 155,35 145,45 145,45 C 145,45 135,35 135,25 C 135,15 145,5 145,5 Z" 
            transform="translate(-80, -130) scale(0.9)" />
            
    </g>

    <g id="group-moda">
      <text x="0" y="90" text-anchor="middle" class="moda-text">Moda Íntima</text>
    </g>
    
  </g>
</svg>